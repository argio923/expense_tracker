quarkus:
  http:
    cors:
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      origins: http://localhost:5173
      enabled: true
      access-control-allow-credentials: true
      headers: accept,authorization,content-type,x-requested-with
    port: 8080
  devservices.enabled: false
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: jdbc:postgresql://localhost:5432/ET
    devservices:
      enabled: false
  hibernate-orm:
    database.default-schema: public
    schema-management.strategy: validate
  log:
    console.level: INFO
    category:
      "io.quarkus.smallrye.jwt":
      level: DEBUG
      "io.smallrye.jwt":
        level: DEBUG
  swagger-ui:
    always-include: true
    path: /swagger

bcrypt:
  work-factory:12

mp:
  jwt:
    verify:
      issuer: expense-tracker
      publickey.location: classpath:security/publicKey.key

smallrye.jwt.sign.key.location: classpath:security/privateKey.key